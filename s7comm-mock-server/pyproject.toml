[project]
name = "s7comm-mock-server"
version = "0.1.0"
description = "Mock Siemens S7 PLC built on python-snap7 for MCP integration tests."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "IndustriAgents" }
]
dependencies = [
    # 2.x: the 3.x server serves empty areas (see Dockerfile).
    "python-snap7>=2.0,<3",
]

[project.scripts]
s7comm-mock-server = "s7_mock_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["s7_mock_server.py"]


# Linted with the ruff pinned in ../s7comm-python/uv.lock (see CONTRIBUTING.md).
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

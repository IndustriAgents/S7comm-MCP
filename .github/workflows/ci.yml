name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Both projects install from their committed uv.lock with --locked, so a
# dependency change that forgot to update the lockfile fails here. The server
# job lints both projects and runs the pytest suite, whose integration tests
# start the mock PLC from this checkout and drive the real MCP server over
# stdio. No real PLC is involved anywhere.
jobs:
  server:
    name: MCP server (s7comm-python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: s7comm-python
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies from uv.lock (with the dev extra)
        run: uv sync --locked --extra dev

      - name: Byte-compile sources
        run: uv run --no-sync python -m compileall -q src

      - name: Lint (ruff check, server and mock)
        run: uv run --no-sync ruff check . ../s7comm-mock-server

      - name: Format (ruff format --check, server and mock)
        run: uv run --no-sync ruff format --check . ../s7comm-mock-server

      # Builds the FastMCP server and registers every tool. The server opens
      # no PLC connection until a tool needs one.
      - name: Import package and register tools
        run: |
          uv run --no-sync python - <<'EOF'
          import asyncio

          from s7comm_mcp import S7CommMCPServer
          from s7comm_mcp.cli import main  # noqa: F401  (console entry point)

          server = S7CommMCPServer()
          tools = asyncio.run(server._mcp.list_tools())
          assert tools, "no MCP tools registered"
          assert all(t.description for t in tools), "a tool has no description"
          assert not server.tool_config.writes_enabled, "writes must be off by default"
          print(f"{len(tools)} tools registered: " + ", ".join(t.name for t in tools))
          EOF

      - name: Tests (unit, mock PLC, MCP over stdio)
        run: uv run --no-sync pytest -v

  # The floors in pyproject.toml must be versions the suite passes on. This
  # installs the lowest version of every direct dependency that the floors
  # allow (instead of uv.lock) and runs the tests and ruff with them.
  server-lowest:
    name: MCP server, lowest direct dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: s7comm-python
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install the lowest direct dependency versions
        run: |
          uv venv --python 3.11 .venv-lowest
          VIRTUAL_ENV=.venv-lowest uv pip install --resolution lowest-direct -e ".[dev]"
          VIRTUAL_ENV=.venv-lowest uv pip list

      - name: Tests (lowest direct dependencies)
        run: .venv-lowest/bin/python -m pytest -q

      - name: Lint and format check (lowest ruff)
        run: |
          .venv-lowest/bin/ruff check . ../s7comm-mock-server
          .venv-lowest/bin/ruff format --check . ../s7comm-mock-server

  mock:
    name: Mock PLC (s7comm-mock-server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: s7comm-mock-server
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies from uv.lock
        run: uv sync --locked

      - name: Byte-compile sources
        run: uv run --no-sync python -m compileall -q s7_mock_server.py

      - name: Console entry point
        run: uv run --no-sync s7comm-mock-server --help

      # Runs the mock from its own locked environment, then checks it binds
      # the requested host and stops cleanly on SIGTERM.
      - name: Start, probe and stop the mock
        run: |
          .venv/bin/s7comm-mock-server --host 127.0.0.1 --port 11102 > mock.log 2>&1 &
          pid=$!
          for _ in $(seq 1 50); do
            (exec 3<>/dev/tcp/127.0.0.1/11102) 2>/dev/null && break
            sleep 0.1
          done
          kill -TERM "$pid"
          wait "$pid"
          cat mock.log
          grep -q "Listening on 127.0.0.1:11102" mock.log
          grep -q "Shutting down" mock.log
